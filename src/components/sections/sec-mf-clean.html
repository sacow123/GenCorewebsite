        <style>
          .clean-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 1586 / 930;
            background: #000;
            overflow: visible;
            border-radius: var(--radius);
          }

          .clean-hotspot {
            position: absolute;
            border: 2px solid rgba(255, 204, 0, 0.5);
            background: transparent;
            cursor: pointer;
            z-index: 5;
            transition: opacity .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
            outline: none;
            animation: pulse-border 2s infinite;
            padding: 0;
          }

          /* Hide all hotspots when ANY is hovered */
          .clean-stage:has(.clean-hotspot:hover) .clean-hotspot {
            opacity: 0;
            animation: none;
            pointer-events: none;
          }

          /* Highlight the hovered one */
          .clean-stage:has(.clean-hotspot:hover) .clean-hotspot:hover {
            opacity: 1;
            pointer-events: auto;
            border-color: rgba(255, 204, 0, 0.95);
            background: rgba(255, 204, 0, 0.10);
            box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.18);
          }

          /* Highlight group-3 together (used for multiple HTML boxes, if any) */
          .clean-stage:has(.clean-hotspot.group-3:hover) .clean-hotspot.group-3 {
            opacity: 1;
            pointer-events: auto;
            border-color: rgba(255, 204, 0, 0.95);
            background: rgba(255, 204, 0, 0.10);
            box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.18);
          }

          /* SVG Hotspot specific styles */
          svg.clean-hotspot {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            animation: none !important;
            overflow: visible;
          }
          svg.clean-hotspot path {
            fill: transparent;
            stroke: rgba(255, 204, 0, 0.5);
            stroke-width: 2.5px;
            stroke-linejoin: round;
            transition: fill .15s ease, stroke .15s ease, filter .15s ease;
            animation: pulse-svg-stroke 2s infinite;
            pointer-events: auto;
          }
          /* Stop SVG path animation on global hover */
          .clean-stage:has(.clean-hotspot:hover) svg.clean-hotspot path {
            animation: none;
          }

          @keyframes pulse-svg-stroke {
            0% { filter: drop-shadow(0 0 0 rgba(255, 204, 0, 0.7)); }
            70% { filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0)); }
            100% { filter: drop-shadow(0 0 0 rgba(255, 204, 0, 0)); }
          }
          
          /* Highlight SVG */
          .clean-stage:has(.clean-hotspot:hover) svg.clean-hotspot:hover {
            opacity: 1;
            pointer-events: auto;
          }
          .clean-stage:has(.clean-hotspot:hover) svg.clean-hotspot:hover path,
          .clean-stage:has(.clean-hotspot.group-3:hover) svg.clean-hotspot.group-3 path {
            stroke: rgba(255, 204, 0, 0.95);
            fill: rgba(255, 204, 0, 0.10);
            filter: drop-shadow(0 0 2px rgba(255, 204, 0, 0.18));
            animation: none;
          }

          .clean-callout {
            position: absolute;
            min-width: 170px;
            max-width: 420px;
            padding: 10px 18px;
            background: rgba(144, 106, 0, 0.92);
            color: #fff;
            border: 2px solid #ffcc00;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .15s ease, transform .15s ease;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.3px;
          }

          .clean-stage:has(.clean-hotspot:hover) .clean-hotspot:hover + .clean-callout {
            opacity: 1;
            transform: translateY(0);
          }
          
          /* Show group 3 callout */
          .clean-stage:has(.clean-hotspot.group-3:hover) .clean-callout.group-3-callout,
          .clean-stage:has(svg.clean-hotspot:hover) .clean-callout.group-3-callout {
            opacity: 1;
            transform: translateY(0);
          }
        </style>
