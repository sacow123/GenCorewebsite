<section id="sec-mai-collet" class="content-section">
  <h2 data-i18n="nav-mai-collet"><span data-i18n="mf-auto-200">🗜️ 콜렛 관리</span></h2>
  <div class="section-anchor" style="font-size:12px; color:#a855f7; margin-bottom:16px; font-family:monospace;">🔗
    Anchor: <a href="#sec-mai-collet" style="color:#a855f7; text-decoration:none;">#sec-mai-collet</a>
  </div>
  <p class="subtitle"><span data-i18n="mf-auto-734">M AI° 유지 보수</span></p>
  <div id="mai-collet-content"></div>
  <script>
    (() => {
      function copyMillFixCollet() {
      const source = document.getElementById('sec-mf-collet');
      const target = document.getElementById('mai-collet-content');
      if (!source || !target || target.childElementCount) return;

      const idMap = {
        'anchor-routine': 'mai-collet-anchor-routine',
        'anchor-cleaning': 'mai-collet-anchor-cleaning'
      };
      let node = source.querySelector('.subtitle')?.nextElementSibling;
      while (node) {
        const copy = node.cloneNode(true);
        [copy, ...copy.querySelectorAll('[id], [href], [onclick]')].forEach((element) => {
          if (element.id && idMap[element.id]) element.id = idMap[element.id];
          if (element.hasAttribute('href')) {
            element.setAttribute('href', element.getAttribute('href').replace(/#(anchor-routine|anchor-cleaning)/g, (_, id) => `#${idMap[id]}`));
          }
          if (element.hasAttribute('onclick')) {
            element.setAttribute('onclick', element.getAttribute('onclick').replace(/(anchor-routine|anchor-cleaning)/g, (id) => idMap[id]));
          }
        });
        target.append(copy);
        node = node.nextElementSibling;
      }
      }

      document.addEventListener('DOMContentLoaded', copyMillFixCollet);
      window.addEventListener('gencore-language-changed', copyMillFixCollet);
    })();
  </script>
</section>
