<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>GenCore Technical Support Center</title>
  <meta name="description" content="GenCore 제품 매뉴얼 및 기술 지원 센터">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

</head>
<body>
  <script src="src/scripts/layout-shell.js"></script>
  <script src="src/scripts/mai-ui-version-nav.js"></script>

<section id="section-search" class="content-section">
        <h2 id="search-results-title"><span data-i18n="mf-auto-670">🔍 검색 결과</span></h2>
        <p class="subtitle" id="search-results-subtitle"></p>
        <div id="search-results-grid" style="display:grid; grid-template-columns: 1fr; gap:12px; margin-top:8px;"></div>
      </section>

<section id="section-home" class="content-section active active">
        <h2 data-i18n="section-home-title">GenCore Technical Support Center</h2>
        <div class="section-anchor" style="font-size:12px; color:#a855f7; margin-bottom:16px; font-family:monospace;">🔗
          Anchor: <a href="#section-home" style="color:#a855f7; text-decoration:none;">#section-home</a></div>
        <p class="subtitle" data-i18n="section-home-desc"><span data-i18n="mf-auto-671">제품 매뉴얼 및 기술 지원 센터에 오신 것을 환영합니다. 좌측 메뉴에서 원하는 항목을 선택해 주세요.</span></p>
        <div class="content-card">
          <h3 data-i18n="card-welcome-title"><span data-i18n="mf-auto-672">환영합니다</span></h3>
          <p data-i18n="card-welcome-body"><span data-i18n="mf-auto-673">GenCore 제품의 설치, 사용, 유지보수에 관한 모든 정보를 이곳에서 확인할 수 있습니다.</span></p>
        </div>
        <div class="content-card">
          <h3 data-i18n="card-lang-title"><span data-i18n="mf-auto-674">다국어 지원</span></h3>
          <p data-i18n="card-lang-body"><span data-i18n="mf-auto-675">우측 상단의 🌐 아이콘을 클릭하여 한국어, English, 日本語, Español 중 원하는 언어를 선택할 수 있습니다.</span></p>
        </div>
      </section>

  <script src="src/scripts/layout-footer.js"></script>
  <script src="src/data/visible-i18n-auto.js"></script>
  <script src="src/scripts/i18n.js"></script>
  <script src="src/data/images.js"></script>
  <script src="src/scripts/app.js"></script>

</body>
</html>
